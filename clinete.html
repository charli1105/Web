<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tarjeta de Lealtad</title>
    <style>
        :root { --bg-dark: #0b1511; --card-bg: #14241e; --text-main: #ffffff; --text-muted: #7da092; --accent: #4caf50; --border-color: #233d33; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; background: var(--card-bg); border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h2 { font-size: 1.5rem; margin-bottom: 4px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .grid-sellos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
        .sello { aspect-ratio: 1; border-radius: 50%; background: var(--bg-dark); border: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.3s; }
        .sello.activo { border-style: solid; border-color: var(--accent); background: rgba(76, 175, 80, 0.1); animation: pop 0.4s ease; }
        .notificacion { display: none; background: #1e3a2f; border: 1px solid var(--accent); padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; }
        @keyframes pop { 0% { transform: scale(0.7); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Mi Tarjeta Digital</h2>
        <p class="subtitle" id="info-status">Cargando tus sellos...</p>

        <div class="notificacion" id="alerta-sello">
            🎉 ¡Sello agregado con éxito por tu compra!
        </div>

        <div class="grid-sellos" id="contenedor-sellos"></div>
    </div>

    <script>
        let sellosActuales = parseInt(localStorage.getItem('mis_sellos_lealtad')) || 0;

        // 1. Verificar si viene del QR del cajero buscando parámetros en la URL (?add=true)
        const parametros = new URLSearchParams(window.location.search);
        if (parametros.has('add')) {
            sellosActuales += 1;
            if (sellosActuales > 10) sellosActuales = 1; // Reinicia al llenar la tarjeta
            
            localStorage.setItem('mis_sellos_lealtad', sellosActuales);
            document.getElementById('alerta-sello').style.display = 'block';
            
            // Limpiar la URL estética para que si recarga la página no se vuelva a sumar otro sello
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // 2. Dibujar la cuadrícula en el teléfono
        function pintarPanel() {
            const contenedor = document.getElementById('contenedor-sellos');
            contenedor.innerHTML = '';
            
            for (let i = 1; i <= 10; i++) {
                const div = document.createElement('div');
                div.className = `sello ${i <= sellosActuales ? 'activo' : ''}`;
                div.innerText = i <= sellosActuales ? '☕' : '';
                contenedor.appendChild(div);
            }
            
            document.getElementById('info-status').innerText = `Llevas ${sellosActuales} de 10 sellos`;
        }

        pintarPanel();
    </script>
</body>
</html>
